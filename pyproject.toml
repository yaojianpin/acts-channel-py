[project]
name = "acts-channel"
version = "0.5.0"
description = "acts channel client"
authors = [{ name = "yaojianping", email = "yaojianpin@sohu.com" }]
dependencies = ["nanoid>=2.0.0", "result>=0.17.0"]
requires-python = ">=3.8"
readme = "README.md"
license = "MIT"
keywords = ["workflow", "acts-channel"]

[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
example = "example:main"
